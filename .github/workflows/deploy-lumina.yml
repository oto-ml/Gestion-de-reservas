name: Deploy Lumina to Azure App Service

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and build frontend
        run: |
          npm ci
          npm run build

      - name: Prepare lightweight deployment package
        run: |
          mkdir -p deploy_pkg
          # 1. Copiamos solo lo que necesita el servidor de producción
          cp server.js package.json package-lock.json deploy_pkg/
          cp -R dist deploy_pkg/
          # 2. Modificamos el JSON de forma segura para borrar los scripts de React.
          # Esto evita que Azure intente recompilar la aplicación y falle.
          node -e "const fs=require('fs'); let p=JSON.parse(fs.readFileSync('deploy_pkg/package.json')); delete p.scripts.build; delete p.scripts.dev; delete p.scripts.preview; fs.writeFileSync('deploy_pkg/package.json', JSON.stringify(p, null, 2));"

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: Lumina
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: deploy_pkg