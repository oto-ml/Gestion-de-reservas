name: Deploy Lumina to Azure App Service

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and build frontend
        run: |
          npm ci
          npm run build

      - name: Prepare complete deployment package
        run: |
          rm -rf deploy
          mkdir -p deploy
          # 1. Copiar código fuente
          cp server.js package.json package-lock.json deploy/
          cp -R dist deploy/
          # 2. Instalar dependencias de producción directamente en el paquete
          cd deploy
          npm ci --omit=dev

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: Lumina
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: deploy